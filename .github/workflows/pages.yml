# Vérifie le code à chaque pull request, et publie la démo web sur GitHub Pages
# à chaque push sur main (ou à la main depuis l'onglet Actions).
name: Vérification et démo web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console:
    name: Version console (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler (avertissements traités comme des erreurs)
        run: g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O2 main.cpp partition.cpp biblioWAV.cpp -o piano
      - name: Tester
        run: bash tests/tester.sh ./piano

  web:
    name: Version web (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Compiler en WebAssembly
        run: bash web/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [console, web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
